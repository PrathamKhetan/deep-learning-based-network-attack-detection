version: "3.9"

services:
  backend:
    build: ./ndr-backend
    container_name: ndr_backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  frontend:
    build: ./ndr-frontend
    container_name: ndr_frontend
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - backend

  mongo:
    image: mongo:7
    container_name: ndr_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ndr

volumes:
  mongo_data:
